<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h1>🔐 Auction Login</h1>
      <p>Swiss Property Auctions</p>
    </div>

    <div *ngIf="error" class="alert alert-error">{{ error }}</div>

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          [(ngModel)]="username"
          name="username"
          placeholder="Enter your username"
          [class.error]="submitted && !username"
          required>
        <small *ngIf="submitted && !username" class="error-text">Username is required</small>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          [(ngModel)]="password"
          name="password"
          placeholder="Enter your password"
          [class.error]="submitted && !password"
          required>
        <small *ngIf="submitted && !password" class="error-text">Password is required</small>
      </div>

      <button type="submit" [disabled]="loading" class="btn-login">
        <span *ngIf="!loading">Sign In</span>
        <span *ngIf="loading">Signing in...</span>
      </button>
    </form>

    <div class="login-footer">
      <p>Don't have an account? <a routerLink="/register">Create one</a></p>
      <p><a href="#">Forgot password?</a></p>
    </div>

    <div class="demo-info">
      <h3>Demo Credentials</h3>
      <p><strong>Admin:</strong> admin / password123</p>
      <p><strong>Bidder:</strong> bidder / password123</p>
    </div>
  </div>
</div>
