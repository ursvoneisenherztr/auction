name: "Copilot Setup Steps"

# Automatically run the setup steps when they are changed to allow for easy validation
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called `copilot-setup-steps`
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node.js dependencies (frontend)
        run: npm ci --prefix frontend

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0"

      - name: Restore .NET dependencies (backend)
        run: dotnet restore backend

      - name: Install Azure Functions Core Tools
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor > microsoft.gpg
          sudo mv microsoft.gpg /etc/apt/trusted.gpg.d/microsoft.gpg
          sudo sh -c 'echo "deb [arch=amd64,arm64 signed-by=/etc/apt/trusted.gpg.d/microsoft.gpg] https://packages.microsoft.com/repos/azure-cli/ focal main" > /etc/apt/sources.list.d/azure-cli.list'
          sudo apt-get update
          sudo apt-get install -y azure-functions-core-tools-4

      - name: Install Playwright browsers
        run: |
          cd frontend
          npx playwright install --with-deps chromium firefox webkit

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Build backend
        run: dotnet build backend --configuration Release

      - name: Run frontend tests
        run: npm test -- --watch=false --browsers=ChromeHeadless --code-coverage --prefix frontend || true

      - name: Run backend tests
        run: dotnet test backend --configuration Release --verbosity normal || true
